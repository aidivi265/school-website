    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(){
        var r = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (r && r !== location.href) {
          history.replaceState(null, null, r);
        }
      })();
    </script>
